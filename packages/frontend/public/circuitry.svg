<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a16"/>
      <stop offset="100%" style="stop-color:#16241e"/>
    </linearGradient>
    <radialGradient id="node" cx="35%" cy="32%" r="70%">
      <stop offset="0%" style="stop-color:#f5b366"/>
      <stop offset="100%" style="stop-color:#d98e3f"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>

  <!-- Wires (drawn behind nodes) -->
  <path d="M30 50 C 46 50, 46 30, 64 30" stroke="#d98e3f" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M30 50 C 46 50, 46 70, 64 70" stroke="#d98e3f" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Left node (source) -->
  <circle cx="30" cy="50" r="14" fill="url(#node)"/>
  <!-- Right nodes -->
  <circle cx="70" cy="30" r="11" fill="url(#node)"/>
  <circle cx="70" cy="70" r="11" fill="url(#node)"/>
</svg>
